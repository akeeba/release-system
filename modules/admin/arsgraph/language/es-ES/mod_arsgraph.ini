MOD_ARSGRAPH="Akeeba Release System - Gráficos de descargas"
MOD_ARSGRAPH_DESCRIPTION="Muestra un gráfico con las descargas gestionadas por Akeeba Release System durante los últimos días."

MOD_ARSGRAPH_ERR_ARSMISSING_HEAD="Akeeba Release System no está disponible"
MOD_ARSGRAPH_ERR_ARSMISSING_BODY="Joomla indica que el componente Akeeba Release System (<code>com_ars</code>) no está instalado o ha sido despublicado. Este módulo no puede mostrar ninguna información; funciona obteniendo datos del componente Akeeba Release System, que actualmente no está disponible."

MOD_ARSGRAPH_LBL_NOLOG_HEAD="El registro de descargas está desactivado"
MOD_ARSGRAPH_LBL_NOLOG_BODY="El gráfico de descargas no está disponible cuando el registro está desactivado."