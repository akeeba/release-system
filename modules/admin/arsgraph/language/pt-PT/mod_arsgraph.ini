MOD_ARSGRAPH="Akeeba Release System - Gráficos de Transferências"
MOD_ARSGRAPH_DESCRIPTION="Apresenta um gráfico com as transferências geridas pelo Akeeba Release System nos últimos dias."

MOD_ARSGRAPH_ERR_ARSMISSING_HEAD="O Akeeba Release System está indisponível"
MOD_ARSGRAPH_ERR_ARSMISSING_BODY="O Joomla indica que o componente Akeeba Release System (<code>com_ars</code>) não está instalado ou foi despublicado. Este módulo não pode apresentar qualquer informação; funciona ao obter dados do componente Akeeba Release System, que está actualmente indisponível."

MOD_ARSGRAPH_LBL_NOLOG_HEAD="O registo de transferências está desactivado"
MOD_ARSGRAPH_LBL_NOLOG_BODY="O gráfico de transferências não está disponível quando o registo está desactivado."