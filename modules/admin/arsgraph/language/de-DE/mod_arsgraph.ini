MOD_ARSGRAPH="Akeeba Release System - Download-Diagramme"
MOD_ARSGRAPH_DESCRIPTION="Zeigt ein Diagramm mit den Downloads an, die vom Akeeba Release System in den letzten Tagen verarbeitet wurden."

MOD_ARSGRAPH_ERR_ARSMISSING_HEAD="Akeeba Release System ist nicht verfügbar"
MOD_ARSGRAPH_ERR_ARSMISSING_BODY="Joomla meldet, dass die Akeeba Release System-Komponente (<code>com_ars</code>) entweder nicht installiert oder deaktiviert ist. Dieses Modul kann keine Informationen anzeigen; es bezieht seine Daten aus der Akeeba Release System-Komponente, die derzeit nicht verfügbar ist."

MOD_ARSGRAPH_LBL_NOLOG_HEAD="Download-Protokollierung ist deaktiviert"
MOD_ARSGRAPH_LBL_NOLOG_BODY="Das Download-Diagramm ist nicht verfügbar, wenn die Protokollierung deaktiviert ist."