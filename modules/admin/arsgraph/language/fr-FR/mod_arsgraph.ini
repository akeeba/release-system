MOD_ARSGRAPH="Akeeba Release System - Graphiques de téléchargements"
MOD_ARSGRAPH_DESCRIPTION="Affiche un graphique des téléchargements gérés par Akeeba Release System au cours des derniers jours."

MOD_ARSGRAPH_ERR_ARSMISSING_HEAD="Akeeba Release System n'est pas disponible"
MOD_ARSGRAPH_ERR_ARSMISSING_BODY="Joomla indique que le composant Akeeba Release System (<code>com_ars</code>) n'est pas installé ou a été dépublié. Ce module ne peut afficher aucune information ; il fonctionne en récupérant des données depuis le composant Akeeba Release System, qui est actuellement indisponible."

MOD_ARSGRAPH_LBL_NOLOG_HEAD="La journalisation des téléchargements est désactivée"
MOD_ARSGRAPH_LBL_NOLOG_BODY="Le graphique de téléchargements n'est pas disponible lorsque la journalisation est désactivée."