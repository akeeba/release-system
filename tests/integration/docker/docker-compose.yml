# Dockerized throwaway AMP stack for the Akeeba Release System end-to-end tests.
#
# All versions are configurable through the .env file (see env.dist):
#   JOOMLA_VERSION, PHP_VERSION, APACHE_VERSION, MYSQL_VERSION, MAILPIT_VERSION.
#
# The php and web images are the ones shared by every Akeeba E2E stack. They are built by
# ../buildfiles/docker/e2e/images.sh — which run.sh calls before bringing the stack up — never by
# this file, hence `pull_policy: never` and no `build:`. Everything specific to ARS is bind-mounted
# into them: php.ini. The Apache vhost is the shared image's default.
#
# Every service, the volume and the network carry the org.akeeba.e2e label, which is what the
# scheduled ../buildfiles/docker/e2e/maintain.sh prunes by.
#
# Do not run this by hand. Use ./run.sh, which scrubs, provisions and tests in
# one shot. This file only describes the services.

name: ars-e2e

x-e2e-labels: &e2e-labels
  org.akeeba.e2e: "1"

services:
  db:
    image: "mysql:${MYSQL_VERSION:-8.4}"
    labels: *e2e-labels
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_NAME:-arse2e}"
      MYSQL_USER: "${DB_USER:-arse2e}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-arse2e}"
    command:
      - "--sql-mode="
    ports:
      # Published so the host-side PHPUnit process can seed and inspect fixtures.
      - "127.0.0.1:${DB_PORT:-33308}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 40

  php:
    image: "akeeba-e2e/php:${PHP_VERSION:-8.4}"
    pull_policy: never
    labels: *e2e-labels
    volumes:
      - ./www:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/conf.d/zz-e2e.ini:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    image: "akeeba-e2e/web:${APACHE_VERSION:-2.4}"
    pull_policy: never
    labels: *e2e-labels
    ports:
      - "127.0.0.1:${HTTP_PORT:-8100}:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - php

  # Outbound mail sink. Joomla is pointed at smtp://mailpit:1025, so the tests
  # exercise the real mailer configuration, PHPMailer and the SMTP dialogue
  # rather than a stubbed Mail::Send(). Inspected over the REST API on 8025.
  #
  # ARS has no inbound mail of its own, so unlike some sibling harnesses this
  # stack does not need a mailbox server that speaks a fetch protocol: Mailpit's
  # job here is purely to give Joomla's mailer (used by user registration and
  # password reset) somewhere to deliver to, so those flows never attempt a
  # real send.
  mailpit:
    image: "axllent/mailpit:${MAILPIT_VERSION:-v1.21}"
    labels: *e2e-labels
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "0"
    ports:
      # The REST API, published for the host-side test runner.
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8135}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
    labels: *e2e-labels

networks:
  default:
    labels: *e2e-labels
