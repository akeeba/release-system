; PHP settings for the end-to-end test site.
; Tuned for a test environment, not production.

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 128M
post_max_size = 128M

; Keep error output out of the HTML so tests observe real 403 pages and redirects
; instead of PHP notices leaking into the response body. Errors still go to the
; log, which run.sh surfaces on failure.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/php-errors.log
error_reporting = E_ALL & ~E_DEPRECATED

expose_php = Off
date.timezone = UTC

; The provisioner writes fixture files into the web root after the site has
; already served requests. Revalidate opcache every request so those changes take
; effect immediately instead of racing against stale bytecode.
opcache.enable = On
opcache.validate_timestamps = On
opcache.revalidate_freq = 0
