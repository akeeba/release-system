COM_ARS_CONFIG_BACKEND_HEADER_DESC = "Επιλογές που επηρεάζουν το backend του συστατικού"

COM_ARS_CONFIG_SHOW_DOWNLOADS_LABEL = "Εμφάνιση μετρητή λήψεων"
COM_ARS_CONFIG_SHOW_DOWNLOADS_DESC = "Εμφανίζει τον αριθμό λήψεων στο frontend"

COM_ARS_CONFIG_BAN_FAILED_LABEL = "Αποκλεισμός μη εξουσιοδοτημένων λήψεων"
COM_ARS_CONFIG_BAN_FAILED_DESC = "Θεωρεί τις μη εξουσιοδοτημένες λήψεις ως εξαιρέσεις ασφαλείας, αποκλείοντας τον χρήστη. Απαιτεί το Admin Tools Professional."

COM_ARS_CONFIG_UPDATES_SHOW_CHECKSUMS_LABEL = "Εμφάνιση αθροισμάτων ελέγχου"
COM_ARS_CONFIG_UPDATES_SHOW_CHECKSUMS_DESC = "Εμφάνιση αθροισμάτων ελέγχου MD5, SHA-1, SHA-256 κ.λπ. στη ροή ενημερώσεων; Απενεργοποιημένο από προεπιλογή επειδή η υλοποίηση ελέγχου αθροισμάτων στο Joomla! έχει σφάλματα — αν το Joomla! αποτύχει να αποσυμπιέσει το αρχείο ZIP, αναφέρει παραβιάσεις αθροισμάτων ελέγχου."

COM_ARS_CONFIG_BACKEND_DATEFORMAT_LABEL = "Μορφή ημερομηνίας"
COM_ARS_CONFIG_BACKEND_DATEFORMAT_DESC = "Μορφή ημερομηνίας για τη στήλη Ημερομηνία κυκλοφορίας στη σελίδα Εκδόσεις. Αφήστε κενό για τη DATE_FORMAT_LC5 του Joomla"

COM_ARS_CONFIG_MINIFY_XML_LABEL = "Συμπαγείς ροές ενημερώσεων"
COM_ARS_CONFIG_MINIFY_XML_DESC = "<p>Να δημιουργούνται ροές ενημερώσεων ελάχιστου μεγέθους;</p><p>Οι ροές ενημερώσεων INI εμφανίζουν ένα σχόλιο εμφάνισης και τις πλήρεις σημειώσεις έκδοσης. Η ενεργοποίηση αυτής της επιλογής αφαιρεί και τα δύο.</p><p>Οι ροές ενημερώσεων XML εξάγονται μορφοποιημένες για ανθρώπους και περιλαμβάνουν ένα σχόλιο εμφάνισης στην κορυφή. Η ενεργοποίηση αυτής της επιλογής αφαιρεί τα κενά εσοχής και το σχόλιο.</p><p>Αυτές οι επιλογές μπορούν να μειώσουν το μέγεθος των αρχείων ενημερώσεων κατά 10% έως 70%, κάτι που έχει σημαντικό αντίκτυπο στη χρήση εύρους ζώνης και σχετικές χρεώσεις όταν υπάρχουν εκατομμύρια αιτήσεις ανά μήνα.</p>"

COM_ARS_CONFIG_USE_COMPATIBILITY_LABEL = "Χρήση συμβατότητας εκδόσεων στις ενημερώσεις"
COM_ARS_CONFIG_USE_COMPATIBILITY_DESC = "<p>Θα πρέπει οι ροές ενημερώσεων να χρησιμοποιούν το συστατικό Συμβατότητας εκδόσεων (com_compatibility) για να αποφεύγεται η καταχώριση περιττών εκδόσεων;</p><p>Αν αυτό είναι ενεργοποιημένο, το συστατικό Akeeba Version Compatibility είναι εγκατεστημένο και το λογισμικό στη ροή ενημερώσεων είναι καταχωρισμένο σε αυτό, τότε μόνο επιλεγμένες εκδόσεις θα εμφανίζονται στη ροή ενημερώσεων. Οι εκδόσεις που συμπεριλαμβάνονται στη ροή ενημερώσεων είναι αυτές που αναφέρονται στη σελίδα συμβατότητας. Αυτό μειώνει το μέγεθος του αρχείου XML ροής ενημερώσεων χωρίς να επηρεάζει τη λειτουργικότητα για τους τελικούς χρήστες. Μόνο οι τελευταίες εκδόσεις για κάθε συνδυασμό PHP και CMS θα είναι διαθέσιμες στη ροή ενημερώσεων, δηλ. μόνο εκδόσεις που το Joomla θα μπορούσε ούτως ή άλλως να επιλέξει.</p>"

COM_ARS_CONFIG_LIAR_MODE_LABEL="Λειτουργία εξαπάτησης"
