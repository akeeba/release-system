COM_ARS_CONFIG_SHOW_DIRECTLINK_LABEL = "Εμφάνιση άμεσου συνδέσμου"
COM_ARS_CONFIG_SHOW_DIRECTLINK_DESC = "Όταν είναι ενεργοποιημένο, εμφανίζεται ένας άμεσος σύνδεσμος λήψης, μαζί με τον Κωδικό λήψης, στους συνδεδεμένους χρήστες. Αυτό είναι χρήσιμο για την εγκατάσταση επί πληρωμή επεκτάσεων στο Joomla! χωρίς να χρειάζεται τοπική λήψη του αρχείου ZIP. Εξαιρετικά βολικό όταν χρησιμοποιείτε tablet ή κινητό χωρίς επιλογή τοπικής αποθήκευσης."
COM_ARS_CONFIG_DIRECTLINKEXTENSIONS_LABEL = "Επεκτάσεις άμεσου συνδέσμου"
COM_ARS_CONFIG_DIRECTLINKEXTENSIONS_DESC = "Μια λίστα επεκτάσεων αρχείων διαχωρισμένων με κόμμα για τις οποίες θα εμφανίζεται ο άμεσος σύνδεσμος. Προτεινόμενο: zip,tar,tar.gz"
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_LABEL = "Περιγραφή άμεσου συνδέσμου"
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_DESC = "Επεξηγηματικό κείμενο που εμφανίζεται δίπλα στον άμεσο σύνδεσμο. Αφήστε κενό για το προεπιλεγμένο κείμενο."
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_DEFAULT = "DirectLink::Αυτός ο σύνδεσμος μπορεί να χρησιμοποιηθεί για τη λήψη του αρχείου χωρίς να χρειάζεται σύνδεση στον ιστότοπο. Μπορεί επίσης να χρησιμοποιηθεί για εύκολη εγκατάσταση των επαγγελματικών επεκτάσεων Joomla! χωρίς να κατεβάσετε τίποτα. Ακολουθεί ο τρόπος. Κάντε δεξί κλικ (ή παρατεταμένο πάτημα, αν χρησιμοποιείτε οθόνη αφής) και αντιγράψτε αυτόν τον σύνδεσμο. Στη συνέχεια μεταβείτε στο backend της διαχείρισης του ιστότοπού σας στο Joomla!, Επεκτάσεις, Διαχείριση επεκτάσεων και επικολλήστε τον στο πεδίο 'Εγκατάσταση από URL' για να εγκαταστήσετε αυτή την επέκταση."

COM_ARS_CONFIG_BEGENCHANGELOG_LABEL = "Δημιουργία αρχείου αλλαγών για εκδόσεις BleedingEdge"
COM_ARS_CONFIG_BEGENCHANGELOG_DESC = "Όταν είναι ενεργοποιημένο, το ARS αναζητά ένα αρχείο με το όνομα CHANGELOG σε κάθε έκδοση BleedingEdge. Στη συνέχεια δημιουργεί αυτόματα σημειώσεις έκδοσης βάσει των διαφορών μεταξύ των αρχείων αλλαγών της τρέχουσας και της προηγούμενης έκδοσης."

