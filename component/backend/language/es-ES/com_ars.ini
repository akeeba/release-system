COM_ARS_CONFIG_SHOW_ENVIRONMENTS_DESC = "Mostrar los iconos de entornos (compatibilidad) en el front-end"

COM_ARS_CONFIG_SHOW_DIRECTLINK_LABEL = "Mostrar enlace directo"
COM_ARS_CONFIG_SHOW_DIRECTLINK_DESC = "Cuando está activado, se mostrará un enlace de descarga directa, con el ID de descarga incluido, a los usuarios con sesión iniciada. Es útil para instalar componentes de pago distribuidos en Joomla! sin tener que descargar el archivo ZIP localmente. Muy práctico cuando se usa una tableta o teléfono sin opción de almacenamiento local."
COM_ARS_CONFIG_DIRECTLINKEXTENSIONS_LABEL = "Extensiones para enlace directo"
COM_ARS_CONFIG_DIRECTLINKEXTENSIONS_DESC = "Lista de extensiones de archivo separadas por comas para las que se mostrará el enlace directo. Recomendado: zip,tar,tar.gz"
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_LABEL = "Descripción del enlace directo"
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_DESC = "Texto explicativo que se mostrará junto al enlace directo. Déjelo en blanco para usar el texto predeterminado."
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_DEFAULT = "DirectLink::Este enlace se puede usar para descargar el archivo sin necesidad de iniciar sesión en el sitio. También se puede usar para instalar fácilmente nuestras extensiones profesionales de Joomla! sin tener que descargar nada. Así es como funciona. Haga clic derecho (o mantenga pulsado si usa una pantalla táctil) y copie este enlace. Luego vaya al panel de administración de su sitio Joomla!, Extensiones, Gestionar extensiones y péguelo en el campo 'Instalar desde URL' para instalar esta extensión."

COM_ARS_CONFIG_BEGENCHANGELOG_LABEL = "Generar registro de cambios para versiones BleedingEdge"
COM_ARS_CONFIG_BEGENCHANGELOG_DESC = "Cuando está activado, ARS buscará un archivo llamado CHANGELOG en cada versión BleedingEdge. A continuación, creará automáticamente notas de versión basadas en las diferencias entre los registros de cambios de la versión actual y la anterior."

COM_ARS_CONFIG_BACKEND_HEADER_LABEL = "Back-end"
COM_ARS_CONFIG_BACKEND_HEADER_DESC = "Opciones que afectan al back-end del componente"

COM_ARS_CONFIG_SHOW_DOWNLOADS_LABEL = "Mostrar contador de descargas"
COM_ARS_CONFIG_SHOW_DOWNLOADS_DESC = "Muestra el número de descargas en el front-end"

COM_ARS_CONFIG_BAN_FAILED_LABEL = "Bloquear descargas no autorizadas"
COM_ARS_CONFIG_BAN_FAILED_DESC = "Considera las descargas no autorizadas como excepciones de seguridad, bloqueando al usuario. Requiere Admin Tools Professional."

COM_ARS_CONFIG_UPDATES_SHOW_CHECKSUMS_LABEL = "Mostrar sumas de verificación"
COM_ARS_CONFIG_UPDATES_SHOW_CHECKSUMS_DESC = "¿Mostrar sumas de verificación MD5, SHA-1, SHA-256, etc. en el flujo de actualización? Desactivado por defecto porque la implementación de verificación de sumas en Joomla! tiene errores: si Joomla! falla al extraer el archivo ZIP, notifica violaciones de suma de verificación."

COM_ARS_CONFIG_BACKEND_DATEFORMAT_LABEL = "Formato de fecha"
COM_ARS_CONFIG_BACKEND_DATEFORMAT_DESC = "Formato de fecha para la columna Publicado el en la página de versiones. Déjelo vacío para usar DATE_FORMAT_LC5 de Joomla"

COM_ARS_CONFIG_MINIFY_XML_LABEL = "Flujos de actualización compactos"
COM_ARS_CONFIG_MINIFY_XML_DESC = "<p>¿Debo crear flujos de actualización de tamaño mínimo?</p><p>Los flujos de actualización INI muestran un comentario de vanidad y las notas de versión completas. Al activar esta opción se eliminan ambos.</p><p>Los flujos de actualización XML se generan con formato legible para personas e incluyen un comentario de vanidad al principio. Al activar esta opción se elimina el sangrado y el comentario.</p><p>Estas opciones pueden reducir el tamaño de los archivos de actualización entre un 10% y un 70%, lo que tiene un gran impacto en el uso de ancho de banda y los costes asociados cuando se producen millones de solicitudes al mes.</p>"

COM_ARS_CONFIG_USE_COMPATIBILITY_LABEL = "Las actualizaciones usan Compatibilidad de versiones"
COM_ARS_CONFIG_USE_COMPATIBILITY_DESC = "<p>¿Deben los flujos de actualización usar el componente de Compatibilidad de versiones (com_compatibility) para evitar mostrar versiones innecesarias?</p><p>Si está activado, el componente Akeeba Version Compatibility está instalado y el software del flujo de actualización está listado en él, de modo que solo se mostrarán las versiones seleccionadas en el flujo de actualización. Las versiones incluidas en el flujo de actualización son las que aparecen en la página de compatibilidad. Esto reduce el tamaño del archivo XML del flujo de actualización sin comprometer la funcionalidad para los usuarios finales. Solo estarán disponibles en el flujo de actualización las últimas versiones para cada combinación de PHP y CMS, es decir, solo las versiones que Joomla podría seleccionar de todos modos.</p>"

COM_ARS_CONFIG_LIAR_MODE_LABEL="Modo mentiroso"
COM_ARS_CONFIG_LIAR_MODE_DESC="Mentir en el archivo XML de actualización, indicando a Joomla que el paquete es compatible con la siguiente versión menor de Joomla y con la totalidad de la siguiente versión principal."

COM_ARS_CONFIG_BLEEDINGEDGE_AGE_LABEL = "Antigüedad máxima de las versiones BleedingEdge (días)"
COM_ARS_CONFIG_BLEEDINGEDGE_AGE_DESC = "<p>Solo conservar versiones BleedingEdge hasta este número de días desde su creación. Pasados estos días se eliminarán automáticamente.</p><p>0 significa que no hay límite de antigüedad para las versiones BleedingEdge.</p>"

COM_ARS_CONFIG_BLEEDINGEDGE_COUNT_LABEL = "Número máximo de versiones BleedingEdge"
COM_ARS_CONFIG_BLEEDINGEDGE_COUNT_DESC = "<p>Solo conservar este número de versiones BleedingEdge por categoría. Las versiones sobrantes se eliminarán automáticamente.</p><p>0 significa que no hay límite en el número de versiones BleedingEdge por categoría.</p>"

