COM_ARS_CONFIG_SHOW_ENVIRONMENTS_DESC = "Mostrar os ícones de ambientes (compatibilidade) no front-end"

COM_ARS_CONFIG_SHOW_DIRECTLINK_LABEL = "Mostrar Ligação Directa"
COM_ARS_CONFIG_SHOW_DIRECTLINK_DESC = "Quando activado, uma ligação de transferência directa, completa com o ID de Transferência, será mostrada aos utilizadores com sessão iniciada. Útil para instalar componentes pagos no Joomla! sem ter de descarregar o arquivo ZIP localmente. Extremamente prático quando utiliza um tablet ou telemóvel sem opção de armazenamento local."
COM_ARS_CONFIG_DIRECTLINKEXTENSIONS_LABEL = "Extensões da Ligação Directa"
COM_ARS_CONFIG_DIRECTLINKEXTENSIONS_DESC = "Uma lista de extensões de ficheiro separadas por vírgulas para as quais mostrar a ligação directa. Recomendado: zip,tar,tar.gz"
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_LABEL = "Descrição da Ligação Directa"
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_DESC = "Texto explicativo a mostrar junto à Ligação Directa. Deixe em branco para utilizar o texto predefinido."
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_DEFAULT = "DirectLink::Esta ligação pode ser utilizada para transferir o ficheiro sem ter de iniciar sessão no site. Também pode ser utilizada para instalar facilmente as nossas extensões profissionais para o Joomla! sem ter de transferir nada. Eis como. Clique com o botão direito (ou pressione longamente, se utilizar um ecrã táctil) e copie esta ligação. Em seguida, aceda ao painel de administração do seu site Joomla!, Extensões, Gerir Extensões e cole-a no campo 'Instalar a partir de URL' para instalar esta extensão."

COM_ARS_CONFIG_BEGENCHANGELOG_LABEL = "Gerar registo de alterações para versões BleedingEdge"
COM_ARS_CONFIG_BEGENCHANGELOG_DESC = "Quando activado, o ARS procura um ficheiro chamado CHANGELOG em cada versão BleedingEdge. Em seguida, cria automaticamente notas de versão com base nas diferenças entre os registos de alterações da versão actual e da versão anterior."

COM_ARS_CONFIG_BACKEND_HEADER_LABEL = "Back-end"
COM_ARS_CONFIG_BACKEND_HEADER_DESC = "Opções que afectam o back-end do componente"

COM_ARS_CONFIG_SHOW_DOWNLOADS_LABEL = "Mostrar contador de transferências"
COM_ARS_CONFIG_SHOW_DOWNLOADS_DESC = "Apresenta o número de transferências no front-end"

COM_ARS_CONFIG_BAN_FAILED_LABEL = "Bloquear transferências não autorizadas"
COM_ARS_CONFIG_BAN_FAILED_DESC = "Considerar as transferências não autorizadas como excepções de segurança, bloqueando o utilizador. Requer o Admin Tools Professional."

COM_ARS_CONFIG_UPDATES_SHOW_CHECKSUMS_LABEL = "Mostrar somas de verificação"
COM_ARS_CONFIG_UPDATES_SHOW_CHECKSUMS_DESC = "Mostrar somas de verificação MD5, SHA-1, SHA-256, etc. no canal de actualizações? Desactivado por predefinição porque a implementação da verificação de somas de verificação no Joomla! tem erros – se o Joomla! não conseguir extrair o ficheiro ZIP, reporta violações de soma de verificação."

COM_ARS_CONFIG_BACKEND_DATEFORMAT_LABEL = "Formato de data"
COM_ARS_CONFIG_BACKEND_DATEFORMAT_DESC = "Formato de data para a coluna Data de Lançamento na página de Versões. Deixe em branco para usar DATE_FORMAT_LC5 do Joomla"

COM_ARS_CONFIG_MINIFY_XML_LABEL = "Compactar Canais de Actualizações"
COM_ARS_CONFIG_MINIFY_XML_DESC = "<p>Devo criar canais de actualizações com tamanho mínimo?</p><p>Os canais de actualizações INI apresentam um comentário de identificação e as notas de versão completas. Activar esta opção remove ambos.</p><p>Os Canais de Actualizações XML são formatados para leitura humana e incluem um comentário de identificação no topo. Activar esta opção remove o espaço em branco de indentação e o comentário.</p><p>Estas opções podem reduzir o tamanho dos ficheiros de actualização em 10% a 70%, o que tem um impacto significativo no consumo de largura de banda e nos custos associados quando há milhões de pedidos por mês.</p>"

COM_ARS_CONFIG_USE_COMPATIBILITY_LABEL = "Actualizações usam Compatibilidade de Versões"
COM_ARS_CONFIG_USE_COMPATIBILITY_DESC = "<p>Os canais de actualizações devem utilizar o componente de Compatibilidade de Versões (com_compatibility) para evitar listar versões desnecessárias?</p><p>Se esta opção estiver activada, o componente Akeeba Version Compatibility estiver instalado e o software do canal de actualizações estiver listado no componente Akeeba Version Compatibility, apenas as versões seleccionadas serão apresentadas no canal de actualizações. As versões incluídas no canal de actualizações são as versões listadas na página de compatibilidade. Isto reduz o tamanho do ficheiro XML do canal de actualizações sem comprometer a funcionalidade para os utilizadores finais. Apenas as versões mais recentes para cada combinação de PHP e CMS estarão disponíveis no canal de actualizações, ou seja, apenas as versões que o Joomla conseguiria seleccionar de qualquer forma.</p>"

COM_ARS_CONFIG_LIAR_MODE_LABEL="Modo enganador"
COM_ARS_CONFIG_LIAR_MODE_DESC="Mentir no ficheiro XML de actualização, dizendo ao Joomla que o pacote suporta a próxima versão menor do Joomla e a totalidade da próxima versão maior."

COM_ARS_CONFIG_BLEEDINGEDGE_AGE_LABEL = "Idade máxima das versões BleedingEdge (dias)"
COM_ARS_CONFIG_BLEEDINGEDGE_AGE_DESC = "<p>Manter apenas as versões BleedingEdge criadas há no máximo este número de dias. Após esse período, serão automaticamente eliminadas.</p><p>0 significa que não existe limite de idade para as versões BleedingEdge.</p>"

COM_ARS_CONFIG_BLEEDINGEDGE_COUNT_LABEL = "Número máximo de versões BleedingEdge"
COM_ARS_CONFIG_BLEEDINGEDGE_COUNT_DESC = "<p>Manter apenas este número de versões BleedingEdge por categoria. As versões em excesso serão automaticamente eliminadas.</p><p>0 significa que não existe limite no número de versões BleedingEdge por categoria.</p>"

