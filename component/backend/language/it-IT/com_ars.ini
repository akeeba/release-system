COM_ARS_CONFIG_SHOW_ENVIRONMENTS_DESC = "Mostra le icone degli ambienti (compatibilità) nel front-end"

COM_ARS_CONFIG_SHOW_DIRECTLINK_LABEL = "Mostra collegamento diretto"
COM_ARS_CONFIG_SHOW_DIRECTLINK_DESC = "Se abilitata, agli utenti registrati verrà mostrato un collegamento diretto al download completo di ID di download. Utile per installare componenti a pagamento in Joomla! senza dover scaricare l'archivio ZIP in locale. Estremamente comodo quando si usa un tablet o uno smartphone senza spazio di archiviazione locale."
COM_ARS_CONFIG_DIRECTLINKEXTENSIONS_LABEL = "Estensioni per il collegamento diretto"
COM_ARS_CONFIG_DIRECTLINKEXTENSIONS_DESC = "Un elenco separato da virgole delle estensioni di file per cui mostrare il collegamento diretto. Consigliato: zip,tar,tar.gz"
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_LABEL = "Descrizione del collegamento diretto"
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_DESC = "Testo esplicativo da mostrare accanto al collegamento diretto. Lascia vuoto per il testo predefinito."
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_DEFAULT = "DirectLink::Questo collegamento può essere usato per scaricare il file senza dover accedere al sito. Può anche essere usato per installare facilmente le nostre estensioni Joomla! Professional senza dover scaricare nulla. Ecco come. Fai clic con il tasto destro (o tieni premuto, se usi un dispositivo touch) e copia questo collegamento. Poi vai nel back-end amministrativo del tuo sito Joomla!, Estensioni, Gestisci estensioni e incollalo nel campo 'Installa dall'URL' per installare questa estensione."

COM_ARS_CONFIG_BEGENCHANGELOG_LABEL = "Genera changelog per le versioni BleedingEdge"
COM_ARS_CONFIG_BEGENCHANGELOG_DESC = "Se attivato, ARS cercherà un file denominato CHANGELOG in ogni versione BleedingEdge. Creerà quindi automaticamente le note di rilascio in base alle differenze tra i changelog della versione corrente e di quella precedente."

COM_ARS_CONFIG_BACKEND_HEADER_LABEL = "Back-end"
COM_ARS_CONFIG_BACKEND_HEADER_DESC = "Opzioni che influenzano il back-end del componente"

COM_ARS_CONFIG_SHOW_DOWNLOADS_LABEL = "Mostra contatore download"
COM_ARS_CONFIG_SHOW_DOWNLOADS_DESC = "Visualizza il numero di download nel front-end"

COM_ARS_CONFIG_BAN_FAILED_LABEL = "Blocca i download non autorizzati"
COM_ARS_CONFIG_BAN_FAILED_DESC = "Considera i download non autorizzati come eccezioni di sicurezza, bannando l'utente. Richiede Admin Tools Professional."

COM_ARS_CONFIG_UPDATES_SHOW_CHECKSUMS_LABEL = "Mostra i checksum"
COM_ARS_CONFIG_UPDATES_SHOW_CHECKSUMS_DESC = "Mostrare i checksum MD5, SHA-1, SHA-256 ecc. nel flusso di aggiornamento? Disabilitato per impostazione predefinita perché l'implementazione del controllo dei checksum in Joomla! è difettosa – se Joomla! non riesce a estrarre il file ZIP segnala violazioni del checksum."

COM_ARS_CONFIG_BACKEND_DATEFORMAT_LABEL = "Formato data"
COM_ARS_CONFIG_BACKEND_DATEFORMAT_DESC = "Formato della data per la colonna Data di rilascio nella pagina Versioni. Vuoto per usare DATE_FORMAT_LC5 di Joomla"

COM_ARS_CONFIG_MINIFY_XML_LABEL = "Comprimi i flussi di aggiornamento"
COM_ARS_CONFIG_MINIFY_XML_DESC = "<p>Creare flussi di aggiornamento di dimensioni minime?</p><p>I flussi di aggiornamento INI mostrano un commento decorativo e le note di rilascio complete. Abilitando questa opzione entrambi vengono rimossi.</p><p>I flussi di aggiornamento XML vengono formattati per essere leggibili dall'uomo e includono un commento decorativo all'inizio. Abilitando questa opzione vengono rimossi gli spazi bianchi per l'indentazione e il commento.</p><p>Queste opzioni possono ridurre la dimensione dei file di aggiornamento dal 10% al 70%, con un impatto significativo sull'utilizzo della larghezza di banda e sui costi relativi quando ci sono milioni di richieste al mese.</p>"

COM_ARS_CONFIG_USE_COMPATIBILITY_LABEL = "Gli aggiornamenti usano la compatibilità delle versioni"
COM_ARS_CONFIG_USE_COMPATIBILITY_DESC = "<p>I flussi di aggiornamento devono usare il componente di compatibilità delle versioni (com_compatibility) per evitare di elencare versioni non necessarie?</p><p>Se abilitato, il componente Akeeba Version Compatibility è installato e il software nel flusso di aggiornamento è elencato nel componente Akeeba Version Compatibility; verranno visualizzate nel flusso di aggiornamento solo le versioni selezionate. Le versioni incluse nel flusso di aggiornamento sono quelle elencate nella pagina di compatibilità. Questo riduce le dimensioni del file XML del flusso di aggiornamento senza compromettere la funzionalità per gli utenti finali. Nel flusso di aggiornamento saranno disponibili solo le versioni più recenti per ogni combinazione di PHP e CMS, ovvero solo le versioni che Joomla sarebbe comunque in grado di selezionare.</p>"

COM_ARS_CONFIG_LIAR_MODE_LABEL="Modalità bugiardo"
COM_ARS_CONFIG_LIAR_MODE_DESC="Menti nel file XML di aggiornamento, dicendo a Joomla che il pacchetto supporta la versione minore successiva di Joomla e l'intera versione principale successiva."

COM_ARS_CONFIG_BLEEDINGEDGE_AGE_LABEL = "Età massima delle versioni BleedingEdge (giorni)"
COM_ARS_CONFIG_BLEEDINGEDGE_AGE_DESC = "<p>Conserva le versioni BleedingEdge solo fino a questo numero di giorni dalla loro creazione. Trascorso tale periodo verranno eliminate automaticamente.</p><p>0 significa che non c'è limite di età per le versioni BleedingEdge.</p>"

COM_ARS_CONFIG_BLEEDINGEDGE_COUNT_LABEL = "Numero massimo di versioni BleedingEdge"
COM_ARS_CONFIG_BLEEDINGEDGE_COUNT_DESC = "<p>Conserva solo questo numero di versioni BleedingEdge per categoria. Le versioni in eccesso verranno eliminate automaticamente.</p><p>0 significa che non c'è limite al numero di versioni BleedingEdge per categoria.</p>"

