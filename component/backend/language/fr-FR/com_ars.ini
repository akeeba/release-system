COM_ARS_CONFIG_SHOW_DIRECTLINK_LABEL = "Afficher le lien direct"
COM_ARS_CONFIG_SHOW_DIRECTLINK_DESC = "Lorsqu'il est activé, un lien de téléchargement direct, avec l'identifiant de téléchargement intégré, sera affiché aux utilisateurs connectés. Cela est utile pour installer des composants payants dans Joomla! sans avoir à télécharger l'archive ZIP localement. Très pratique lorsque vous utilisez une tablette ou un téléphone sans option de stockage local."
COM_ARS_CONFIG_DIRECTLINKEXTENSIONS_LABEL = "Extensions pour le lien direct"
COM_ARS_CONFIG_DIRECTLINKEXTENSIONS_DESC = "Une liste d'extensions de fichiers séparées par des virgules pour lesquelles afficher le lien direct. Recommandé : zip,tar,tar.gz"
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_LABEL = "Description du lien direct"
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_DESC = "Texte explicatif à afficher à côté du lien direct. Laisser vide pour utiliser le texte par défaut."
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_DEFAULT = "DirectLink::Ce lien peut être utilisé pour télécharger le fichier sans avoir à se connecter au site. Il peut également être utilisé pour installer facilement nos extensions Joomla! professionnelles sans rien télécharger. Voici comment procéder. Faites un clic droit (ou appuyez longuement sur un écran tactile) et copiez ce lien. Ensuite, accédez à l'administration de votre site Joomla!, Extensions, Gérer les extensions et collez-le dans le champ « Installer depuis une URL » pour installer cette extension."

COM_ARS_CONFIG_BEGENCHANGELOG_LABEL = "Générer le journal des modifications pour les versions BleedingEdge"
COM_ARS_CONFIG_BEGENCHANGELOG_DESC = "Lorsque cette option est activée, ARS recherche un fichier nommé CHANGELOG dans chaque version BleedingEdge. Il crée ensuite automatiquement des notes de version basées sur les différences entre les journaux de modifications de la version actuelle et de la version précédente."

COM_ARS_CONFIG_BACKEND_HEADER_LABEL = "Administration"
COM_ARS_CONFIG_BACKEND_HEADER_DESC = "Options affectant l'administration du composant"

COM_ARS_CONFIG_SHOW_DOWNLOADS_LABEL = "Afficher le compteur de téléchargements"
COM_ARS_CONFIG_SHOW_DOWNLOADS_DESC = "Affiche le nombre de téléchargements dans la partie publique"

COM_ARS_CONFIG_BAN_FAILED_LABEL = "Bannir les téléchargements non autorisés"
COM_ARS_CONFIG_BAN_FAILED_DESC = "Considère les téléchargements non autorisés comme des exceptions de sécurité, bannissant l'utilisateur. Nécessite Admin Tools Professional."

COM_ARS_CONFIG_UPDATES_SHOW_CHECKSUMS_LABEL = "Afficher les sommes de contrôle"
COM_ARS_CONFIG_UPDATES_SHOW_CHECKSUMS_DESC = "Afficher les sommes de contrôle MD5, SHA-1, SHA-256, etc. dans le flux de mise à jour ? Désactivé par défaut car l'implémentation de la vérification des sommes de contrôle dans Joomla! est défectueuse – si Joomla! échoue à extraire le fichier ZIP, il signale des violations de somme de contrôle."

COM_ARS_CONFIG_BACKEND_DATEFORMAT_LABEL = "Format de date"
COM_ARS_CONFIG_BACKEND_DATEFORMAT_DESC = "Format de date pour la colonne Date de publication dans la page des versions. Vide pour utiliser le format DATE_FORMAT_LC5 de Joomla"

COM_ARS_CONFIG_MINIFY_XML_LABEL = "Flux de mise à jour compacts"
COM_ARS_CONFIG_MINIFY_XML_DESC = "<p>Dois-je créer des flux de mise à jour de taille minimale ?</p><p>Les flux de mise à jour INI affichent un commentaire de présentation et les notes de version complètes. L'activation de cette option supprime les deux.</p><p>Les flux de mise à jour XML sont formatés pour être lisibles par les humains et incluent un commentaire de présentation en haut. L'activation de cette option supprime l'indentation et le commentaire.</p><p>Ces options peuvent réduire la taille des fichiers de mise à jour de 10 % à 70 %, ce qui a un impact majeur sur la consommation de bande passante et les frais associés lorsqu'il y a des millions de requêtes par mois.</p>"

COM_ARS_CONFIG_USE_COMPATIBILITY_LABEL = "Les mises à jour utilisent la compatibilité de version"
COM_ARS_CONFIG_USE_COMPATIBILITY_DESC = "<p>Les flux de mise à jour doivent-ils utiliser le composant de compatibilité de version (com_compatibility) pour éviter d'afficher des versions inutiles ?</p><p>Si cette option est activée, le composant de compatibilité de version Akeeba est installé et le logiciel dans le flux de mise à jour est répertorié dans le composant de compatibilité de version Akeeba ; seules certaines versions seront affichées dans le flux de mise à jour. Les versions incluses dans le flux sont celles figurant sur la page de compatibilité. Cela réduit la taille du fichier XML du flux de mise à jour sans compromettre les fonctionnalités pour les utilisateurs finaux. Seules les dernières versions pour chaque combinaison PHP et CMS seront disponibles dans le flux de mise à jour, c'est-à-dire uniquement les versions que Joomla pourrait sélectionner de toute façon.</p>"

COM_ARS_CONFIG_LIAR_MODE_LABEL="Mode menteur"
COM_ARS_CONFIG_LIAR_MODE_DESC="Mentir dans le fichier XML de mise à jour en indiquant à Joomla que le paquet prend en charge la prochaine version mineure de Joomla, et l'intégralité de la prochaine version majeure."

COM_ARS_CONFIG_BLEEDINGEDGE_AGE_LABEL = "Âge maximal des versions BleedingEdge (jours)"
COM_ARS_CONFIG_BLEEDINGEDGE_AGE_DESC = "<p>Ne conserver les versions BleedingEdge que pendant ce nombre de jours depuis leur création. Passé ce délai, elles seront automatiquement supprimées.</p><p>0 signifie qu'il n'y a pas de limite d'âge pour les versions BleedingEdge.</p>"

COM_ARS_CONFIG_BLEEDINGEDGE_COUNT_LABEL = "Nombre maximum de versions BleedingEdge"
COM_ARS_CONFIG_BLEEDINGEDGE_COUNT_DESC = "<p>Ne conserver que ce nombre de versions BleedingEdge par catégorie. Les versions excédentaires seront automatiquement supprimées.</p><p>0 signifie qu'il n'y a pas de limite au nombre de versions BleedingEdge par catégorie.</p>"

