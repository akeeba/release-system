COM_ARS_CONFIG_SHOW_DIRECTLINK_LABEL = "Direktlink anzeigen"
COM_ARS_CONFIG_SHOW_DIRECTLINK_DESC = "Wenn aktiviert, wird angemeldeten Benutzern ein direkter Download-Link mit Download-ID angezeigt. Dies ist nützlich, um kostenpflichtige Komponenten in Joomla! zu installieren, ohne das ZIP-Archiv lokal herunterladen zu müssen. Besonders praktisch bei Tablets oder Smartphones ohne lokale Speichermöglichkeit."
COM_ARS_CONFIG_DIRECTLINKEXTENSIONS_LABEL = "Direktlink-Dateiendungen"
COM_ARS_CONFIG_DIRECTLINKEXTENSIONS_DESC = "Eine kommagetrennte Liste von Dateiendungen, für die der Direktlink angezeigt werden soll. Empfohlen: zip,tar,tar.gz"
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_LABEL = "Direktlink-Beschreibung"
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_DESC = "Erläuternder Text, der neben dem Direktlink angezeigt wird. Leer lassen für den Standardtext."
COM_ARS_CONFIG_DIRECTLINKDESCRIPTION_DEFAULT = "DirectLink::Dieser Link kann verwendet werden, um die Datei herunterzuladen, ohne sich auf der Website anmelden zu müssen. Er kann auch verwendet werden, um unsere Professional Joomla!-Erweiterungen einfach zu installieren, ohne etwas herunterladen zu müssen. So geht's: Klicken Sie mit der rechten Maustaste (oder tippen und halten Sie bei einem Touchscreen) und kopieren Sie diesen Link. Gehen Sie dann zum Administrator-Backend Ihrer Joomla!-Website, zu Erweiterungen, Erweiterungen verwalten, und fügen Sie den Link in das Feld 'Von URL installieren' ein, um die Erweiterung zu installieren."

COM_ARS_CONFIG_BEGENCHANGELOG_LABEL = "Änderungsprotokoll für BleedingEdge-Versionen generieren"
COM_ARS_CONFIG_BEGENCHANGELOG_DESC = "Wenn aktiviert, sucht ARS in jeder BleedingEdge-Version nach einer Datei namens CHANGELOG. Anschließend werden automatisch Versionshinweise anhand der Unterschiede zwischen den Änderungsprotokollen der aktuellen und der vorherigen Version erstellt."

COM_ARS_CONFIG_BACKEND_HEADER_LABEL = "Backend"
COM_ARS_CONFIG_BACKEND_HEADER_DESC = "Optionen, die das Backend der Komponente beeinflussen"

COM_ARS_CONFIG_SHOW_DOWNLOADS_LABEL = "Download-Zähler anzeigen"
COM_ARS_CONFIG_SHOW_DOWNLOADS_DESC = "Zeigt die Anzahl der Downloads im Frontend an"

COM_ARS_CONFIG_BAN_FAILED_LABEL = "Nicht autorisierte Downloads sperren"
COM_ARS_CONFIG_BAN_FAILED_DESC = "Nicht autorisierte Downloads als Sicherheitsausnahmen behandeln und den Benutzer sperren. Erfordert Admin Tools Professional."

COM_ARS_CONFIG_UPDATES_SHOW_CHECKSUMS_LABEL = "Prüfsummen anzeigen"
COM_ARS_CONFIG_UPDATES_SHOW_CHECKSUMS_DESC = "MD5, SHA-1, SHA-256 usw. Prüfsummen im Update-Stream anzeigen? Standardmäßig deaktiviert, da die Implementierung der Prüfsummenprüfung in Joomla! fehlerhaft ist – wenn Joomla! die ZIP-Datei nicht entpacken kann, meldet es Prüfsummenfehler."

COM_ARS_CONFIG_BACKEND_DATEFORMAT_LABEL = "Datumsformat"
COM_ARS_CONFIG_BACKEND_DATEFORMAT_DESC = "Datumsformat für die Spalte 'Veröffentlicht am' auf der Versionsseite. Leer lassen für Joomlas DATE_FORMAT_LC5"

COM_ARS_CONFIG_MINIFY_XML_LABEL = "Update-Streams komprimieren"
COM_ARS_CONFIG_MINIFY_XML_DESC = "<p>Sollen Update-Streams in minimaler Größe erstellt werden?</p><p>INI-Update-Streams zeigen einen Vanity-Kommentar und die vollständigen Versionshinweise an. Das Aktivieren dieser Option entfernt beides.</p><p>XML-Update-Streams werden für Menschen lesbar formatiert und enthalten oben einen Vanity-Kommentar. Das Aktivieren dieser Option entfernt die Einrückungsabstände und den Kommentar.</p><p>Diese Optionen können die Größe der Update-Dateien um 10 % bis 70 % reduzieren, was sich erheblich auf den Bandbreitenverbrauch und die damit verbundenen Kosten auswirkt, wenn monatlich Millionen von Anfragen gestellt werden.</p>"

COM_ARS_CONFIG_USE_COMPATIBILITY_LABEL = "Updates verwenden Versionskompatibilität"
COM_ARS_CONFIG_USE_COMPATIBILITY_DESC = "<p>Sollen die Update-Streams die Versionskompatibilitäts-Komponente (com_compatibility) verwenden, um unnötige Versionen auszublenden?</p><p>Wenn dies aktiviert ist, die Akeeba-Versionskompatibilitäts-Komponente installiert ist und die Software im Update-Stream in der Akeeba-Versionskompatibilitäts-Komponente aufgeführt ist, werden nur ausgewählte Versionen im Update-Stream angezeigt. Die im Update-Stream enthaltenen Versionen sind die Versionen, die auf der Kompatibilitätsseite aufgeführt sind. Dies reduziert die Größe der Update-Stream-XML-Datei, ohne die Funktionalität für Endbenutzer zu beeinträchtigen. Im Update-Stream sind nur die neuesten Versionen für jede PHP- und CMS-Kombination verfügbar, d. h. nur die Versionen, die Joomla sowieso auswählen würde.</p>"

COM_ARS_CONFIG_LIAR_MODE_LABEL="Lügner-Modus"
COM_ARS_CONFIG_LIAR_MODE_DESC="Lügt in der XML-Update-Datei und teilt Joomla mit, dass das Paket die nächste Joomla-Nebenversion und die gesamte nächste Hauptversion unterstützt."

COM_ARS_CONFIG_BLEEDINGEDGE_AGE_LABEL = "Maximales Alter von BleedingEdge-Versionen (Tage)"
COM_ARS_CONFIG_BLEEDINGEDGE_AGE_DESC = "<p>Nur BleedingEdge-Versionen bis zu dieser Anzahl von Tagen seit ihrer Erstellung behalten. Nach dieser Anzahl von Tagen werden sie automatisch gelöscht.</p><p>0 bedeutet, dass es kein Alterslimit für BleedingEdge-Versionen gibt.</p>"

COM_ARS_CONFIG_BLEEDINGEDGE_COUNT_LABEL = "Maximale Anzahl von BleedingEdge-Versionen"
COM_ARS_CONFIG_BLEEDINGEDGE_COUNT_DESC = "<p>Nur diese Anzahl von BleedingEdge-Versionen pro Kategorie behalten. Überschüssige Versionen werden automatisch gelöscht.</p><p>0 bedeutet, dass es keine Begrenzung der Anzahl von BleedingEdge-Versionen pro Kategorie gibt.</p>"

